# ============================================================
#  DREADFRAME  -  shaders.properties
#  Iris 1.11.x / MC 1.21.x+ / GLSL 120 legacy pipeline
# ============================================================

# ---------- option screens ----------
screen                = <profile> [SCR_CORE] [SCR_BRUSH] [SCR_LIGHT] [SCR_FX] [SCR_DEBUG]
screen.columns        = 2

screen.SCR_CORE       = DREAD HARD_CUT RED_HUE POSTERIZE OUTLINE OUTLINE_WIDTH
screen.SCR_CORE.columns = 2

screen.SCR_BRUSH      = DRYBRUSH BRUSH_SCALE BRUSH_STREAK BRUSH_OCTAVES INK_BLEED BRISTLE_SKIP SPECKLE WORLD_LOCK EDGE_ROUGH
screen.SCR_BRUSH.columns = 2

screen.SCR_LIGHT      = VISIBILITY DARK_RANGE NIGHT_BOOST TORCH_WARMTH SKY_DEATH AMBIENT_FLOOR SUN_MOON_DIM
screen.SCR_LIGHT.columns = 2

screen.SCR_FX         = PULSE GRAIN GRAIN_SIZE CHROMA VIGNETTE TORN_EDGE JITTER SCANLINE
screen.SCR_FX.columns = 2

screen.SCR_DEBUG      = DEBUG_VIEW
screen.SCR_DEBUG.columns = 1

# ---------- sliders (otherwise they render as on/off buttons) ----------
sliders = DREAD HARD_CUT RED_HUE POSTERIZE OUTLINE OUTLINE_WIDTH \
          DRYBRUSH BRUSH_SCALE BRUSH_STREAK BRUSH_OCTAVES INK_BLEED BRISTLE_SKIP SPECKLE WORLD_LOCK EDGE_ROUGH \
          VISIBILITY DARK_RANGE NIGHT_BOOST TORCH_WARMTH SKY_DEATH AMBIENT_FLOOR SUN_MOON_DIM \
          PULSE GRAIN GRAIN_SIZE CHROMA VIGNETTE TORN_EDGE JITTER SCANLINE DEBUG_VIEW

# ---------- profiles (= the "reset" buttons, present from day one) ----------
profile.VANILLA_SAFE = DREAD=0.20 HARD_CUT=0.00 RED_HUE=0.30 POSTERIZE=0.00 OUTLINE=0.20 OUTLINE_WIDTH=1.0 \
                       DRYBRUSH=0.10 BRUSH_SCALE=1.0 BRUSH_STREAK=0.30 BRUSH_OCTAVES=2 INK_BLEED=0.50 BRISTLE_SKIP=0.10 SPECKLE=0.10 WORLD_LOCK=0.70 EDGE_ROUGH=0.20 \
                       VISIBILITY=1.00 DARK_RANGE=256.0 NIGHT_BOOST=0.00 TORCH_WARMTH=0.30 SKY_DEATH=0.20 AMBIENT_FLOOR=0.30 SUN_MOON_DIM=1.00 \
                       PULSE=0.00 GRAIN=0.10 GRAIN_SIZE=1.0 CHROMA=0.10 VIGNETTE=0.20 TORN_EDGE=0.00 JITTER=0.00 SCANLINE=0.00 DEBUG_VIEW=0

profile.PLAYABLE     = DREAD=0.70 HARD_CUT=0.00 RED_HUE=0.80 POSTERIZE=0.00 OUTLINE=0.60 OUTLINE_WIDTH=1.0 \
                       DRYBRUSH=0.65 BRUSH_SCALE=1.0 BRUSH_STREAK=0.60 BRUSH_OCTAVES=3 INK_BLEED=0.50 BRISTLE_SKIP=0.55 SPECKLE=0.45 WORLD_LOCK=0.70 EDGE_ROUGH=0.70 \
                       VISIBILITY=0.60 DARK_RANGE=64.0 NIGHT_BOOST=0.40 TORCH_WARMTH=0.70 SKY_DEATH=0.70 AMBIENT_FLOOR=0.10 SUN_MOON_DIM=0.45 \
                       PULSE=0.50 GRAIN=0.30 GRAIN_SIZE=2.0 CHROMA=0.40 VIGNETTE=0.50 TORN_EDGE=0.55 JITTER=0.20 SCANLINE=0.20 DEBUG_VIEW=0

profile.WOODCUT      = DREAD=0.90 HARD_CUT=0.60 RED_HUE=1.00 POSTERIZE=0.60 OUTLINE=0.70 OUTLINE_WIDTH=2.0 \
                       DRYBRUSH=1.00 BRUSH_SCALE=1.5 BRUSH_STREAK=0.90 BRUSH_OCTAVES=4 INK_BLEED=0.60 BRISTLE_SKIP=0.80 SPECKLE=0.70 WORLD_LOCK=0.90 EDGE_ROUGH=0.90 \
                       VISIBILITY=0.60 DARK_RANGE=64.0 NIGHT_BOOST=0.30 TORCH_WARMTH=0.90 SKY_DEATH=0.90 AMBIENT_FLOOR=0.15 SUN_MOON_DIM=0.30 \
                       PULSE=0.40 GRAIN=0.50 GRAIN_SIZE=3.0 CHROMA=0.20 VIGNETTE=0.60 TORN_EDGE=1.00 JITTER=0.10 SCANLINE=0.00 DEBUG_VIEW=0

profile.NIGHTMARE    = DREAD=0.90 HARD_CUT=0.30 RED_HUE=1.00 POSTERIZE=0.30 OUTLINE=0.80 OUTLINE_WIDTH=2.0 \
                       DRYBRUSH=0.80 BRUSH_SCALE=2.0 BRUSH_STREAK=0.70 BRUSH_OCTAVES=3 INK_BLEED=0.60 BRISTLE_SKIP=0.60 SPECKLE=0.60 WORLD_LOCK=0.60 EDGE_ROUGH=0.80 \
                       VISIBILITY=0.40 DARK_RANGE=40.0 NIGHT_BOOST=0.70 TORCH_WARMTH=0.90 SKY_DEATH=0.90 AMBIENT_FLOOR=0.05 SUN_MOON_DIM=0.30 \
                       PULSE=0.80 GRAIN=0.50 GRAIN_SIZE=2.0 CHROMA=0.60 VIGNETTE=0.70 TORN_EDGE=0.70 JITTER=0.40 SCANLINE=0.30 DEBUG_VIEW=0

profile.SCREENSHOT   = DREAD=1.00 HARD_CUT=1.00 RED_HUE=1.00 POSTERIZE=1.00 OUTLINE=0.00 OUTLINE_WIDTH=1.0 \
                       DRYBRUSH=1.00 BRUSH_SCALE=1.5 BRUSH_STREAK=0.80 BRUSH_OCTAVES=4 INK_BLEED=0.50 BRISTLE_SKIP=0.70 SPECKLE=0.80 WORLD_LOCK=1.00 EDGE_ROUGH=1.00 \
                       VISIBILITY=0.60 DARK_RANGE=96.0 NIGHT_BOOST=0.00 TORCH_WARMTH=1.00 SKY_DEATH=1.00 AMBIENT_FLOOR=0.00 SUN_MOON_DIM=0.15 \
                       PULSE=0.00 GRAIN=0.40 GRAIN_SIZE=3.0 CHROMA=0.00 VIGNETTE=0.00 TORN_EDGE=0.00 JITTER=0.00 SCANLINE=0.00 DEBUG_VIEW=0

# ---------- blending: 4 args or the single token 'off'. never 2. ----------
blend.composite       = off
blend.final           = off
# sun/moon are ADDITIVE in vanilla -> force normal blend so they don't nuke the buffer
blend.gbuffers_skytextured  = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# ---------- misc ----------
clouds      = fast
underwaterOverlay = false
vignette    = false
oldLighting = false
